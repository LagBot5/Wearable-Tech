<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Controller</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #6F8FAF;
      --card-bg: rgba(255, 255, 255, 0.12);
      --btn-light: #FFFFFF;
      --btn-dark: #E5D9C7;
      --text: #2B3B53;
      --shadow: rgba(11, 22, 40, 0.2);
      --green: #2ecc71;
      --blue: #3498db;
      --orange: #e67e22;
      --red: #e74c3c;
      --purple: #9b59b6;
      --yellow: #f39c12;
    }

    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      gap: 20px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #FFFFFF 0%, var(--btn-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      margin-bottom: 10px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(4px);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 12px var(--shadow);
      min-width: 300px;
      max-width: 600px;
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
    }

    .status-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px 15px;
      font-size: 13px;
    }

    .status-label {
      font-weight: 600;
    }

    .status-value {
      font-weight: bold;
    }

    /* Controls Layout */
    .controls-container {
      display: flex;
      gap: 40px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* D-Pad */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 70px);
      grid-template-rows: repeat(3, 70px);
      gap: 8px;
    }

    .dpad-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--btn-light), var(--btn-dark));
      color: var(--text);
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 16px var(--shadow);
      transition: all 0.12s ease;
      user-select: none;
    }

    .dpad-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px var(--shadow);
    }

    .dpad-btn:active {
      transform: translateY(-1px) scale(0.96);
    }

    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-center {
      grid-column: 2;
      grid-row: 2;
      background: linear-gradient(135deg, #ef6b6b, #e74c3c);
      font-size: 20px;
      pointer-events: all;
      cursor: pointer;
    }
    .dpad-right { grid-column: 3; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 3; }

    /* Attack Buttons */
    .attack-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .attack-btn {
      width: 100px;
      height: 100px;
      border: none;
      border-radius: 20px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 16px var(--shadow);
      transition: all 0.12s ease;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
    }

    .attack-btn:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 36px var(--shadow);
    }

    .attack-btn:active {
      transform: translateY(-2px) scale(0.95);
    }

    .attack1 {
      background: linear-gradient(135deg, #f39c12, #e67e22);
      color: white;
    }

    .attack2 {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: white;
    }

    /* Movement Log */
    .log-container {
      max-height: 200px;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 11px;
    }

    .log-entry {
      padding: 6px 10px;
      margin: 4px 0;
      border-radius: 6px;
      font-weight: 600;
    }

    .log-time {
      opacity: 0.7;
      font-size: 10px;
    }

    /* Animations */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }

    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes flash {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .flash {
      animation: flash 0.5s ease;
    }

    /* Responsive */
    @media (max-width: 600px) {
      h1 { font-size: 24px; }
      .dpad {
        grid-template-columns: repeat(3, 50px);
        grid-template-rows: repeat(3, 50px);
        gap: 5px;
      }
      .dpad-btn { font-size: 20px; }
      .attack-btn { width: 80px; height: 80px; font-size: 16px; }
      .controls-container { gap: 20px; }
    }
  </style>
</head>
<body>
  <h1>🚗 Robot Controller</h1>

  <!-- Connection Status -->
  <div class="card" id="connection-card" style="background: rgba(52,152,219,0.15); border-left: 4px solid var(--blue);">
    <div class="card-title" id="connection-status">⚪ Connecting...</div>
  </div>

  <!-- System State -->
  <div class="card" style="background: rgba(43,138,239,0.15); border-left: 4px solid var(--blue);">
    <div class="card-title">🖥️ SYSTEM STATE</div>
    <div class="status-grid">
      <span class="status-label">Power:</span>
      <span class="status-value" id="power">OFF</span>
      <span class="status-label">Devices:</span>
      <span class="status-value" id="devices">Unknown</span>
      <span class="status-label">Network:</span>
      <span class="status-value" id="network">Checking...</span>
      <span class="status-label">Clients:</span>
      <span class="status-value" id="clients">0</span>
    </div>
  </div>

  <!-- Car Status -->
  <div class="card" style="background: rgba(46,204,113,0.15); border-left: 4px solid var(--green);">
    <div class="card-title">Car Status</div>
    <div style="font-size: 24px; font-weight: bold; text-align: center; margin: 10px 0;" id="car-status">Ready</div>
    <div style="font-size: 12px; text-align: center; opacity: 0.7;">Tilt to control or use buttons</div>
  </div>

  <!-- IMU Rotation -->
  <div class="card" style="background: rgba(155,89,182,0.15); border-left: 4px solid var(--purple);">
    <div class="card-title">🎮 IMU ROTATION</div>
    <div class="status-grid">
      <span class="status-label">Finger 1:</span>
      <span class="status-value" id="finger1">CENTER</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-container">
    <!-- D-Pad with Brake -->
    <div class="dpad">
      <button class="dpad-btn dpad-up" id="btn-up">▲</button>
      <button class="dpad-btn dpad-left" id="btn-left">◀</button>
      <button class="dpad-btn dpad-center" id="btn-brake">🛑</button>
      <button class="dpad-btn dpad-right" id="btn-right">▶</button>
      <button class="dpad-btn dpad-down" id="btn-down">▼</button>
    </div>

    <!-- Attack Buttons -->
    <div class="attack-buttons">
      <button class="attack-btn attack1" id="btn-attack1">⚔️<br>ATK1</button>
      <button class="attack-btn attack2" id="btn-attack2">💥<br>ATK2</button>
    </div>
  </div>

  <!-- Movement Log -->
  <div class="card" style="background: rgba(52,152,219,0.15); border-left: 4px solid var(--blue);">
    <div class="card-title">📋 MOVEMENT LOG</div>
    <div class="log-container" id="log">
      <div style="text-align: center; color: #95a5a6; padding: 20px;">No movements yet...</div>
    </div>
  </div>

  <script>
    // Configuration
    const API_BASE = window.location.protocol + '//' + window.location.host;
    const PICO_IP = window.location.hostname;
    
    console.log('[INIT] Controller starting...');
    console.log('[INIT] API Base:', API_BASE);

    // State
    let isConnected = false;
    let consecutiveFailures = 0;
    let lastSuccessTime = Date.now();
    let lastCarCommand = { direction: '', speed: 0 };

    // DOM Elements
    const elements = {
      connectionCard: document.getElementById('connection-card'),
      connectionStatus: document.getElementById('connection-status'),
      power: document.getElementById('power'),
      devices: document.getElementById('devices'),
      network: document.getElementById('network'),
      clients: document.getElementById('clients'),
      carStatus: document.getElementById('car-status'),
      finger1: document.getElementById('finger1'),
      log: document.getElementById('log'),
      buttons: {
        up: document.getElementById('btn-up'),
        down: document.getElementById('btn-down'),
        left: document.getElementById('btn-left'),
        right: document.getElementById('btn-right'),
        brake: document.getElementById('btn-brake'),
        attack1: document.getElementById('btn-attack1'),
        attack2: document.getElementById('btn-attack2')
      }
    };

    // Logging
    function logMovement(label, emoji, color) {
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = 'log-entry flash';
      entry.style.background = color;
      entry.innerHTML = `<span class="log-time">${time}</span> ${emoji} <strong>${label}</strong>`;
      
      // Remove placeholder
      if (elements.log.children.length === 1 && elements.log.textContent.includes('No movements')) {
        elements.log.innerHTML = '';
      }
      
      elements.log.insertBefore(entry, elements.log.firstChild);
      
      // Keep last 10 entries
      while (elements.log.children.length > 10) {
        elements.log.removeChild(elements.log.lastChild);
      }
      
      console.log(`[ACTION] ${label}`);
    }

    // API Communication
    async function sendCommand(command) {
      try {
        const response = await fetch(API_BASE + '/press', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ button: command })
        });
        return await response.json();
      } catch (error) {
        console.error('[API] Command failed:', error);
        return null;
      }
    }

    async function fetchSensors() {
      try {
        const response = await fetch(API_BASE + '/sensors');
        if (!response.ok) throw new Error('Network error');
        
        const data = await response.json();
        lastSuccessTime = Date.now();
        consecutiveFailures = 0;
        isConnected = true;
        
        // Update connection status
        updateConnectionStatus(true);
        
        // Update sensor data
        if (data.finger1) updateFingerDisplay('finger1', data.finger1);
        if (data.client_count !== undefined) {
          elements.clients.textContent = data.client_count;
        }
        
        // Update car status and log when command changes
        if (data.car_command && data.car_command.direction !== lastCarCommand.direction) {
          lastCarCommand = data.car_command;
          const dir = data.car_command.direction;
          
          if (dir === 'forward') {
            setCarStatus('⬆️ Forward', '52,152,219');
            logMovement('Forward', '⬆️', 'rgba(52,152,219, 0.3)');
          } else if (dir === 'backward') {
            setCarStatus('⬇️ Backward', '230,126,34');
            logMovement('Backward', '⬇️', 'rgba(230,126,34, 0.3)');
          } else if (dir === 'left') {
            setCarStatus('⬅️ Left', '155,89,182');
            logMovement('Left', '⬅️', 'rgba(155,89,182, 0.3)');
          } else if (dir === 'right') {
            setCarStatus('➡️ Right', '26,188,156');
            logMovement('Right', '➡️', 'rgba(26,188,156, 0.3)');
          } else if (dir === 'stop') {
            setCarStatus('🛑 STOP', '231,76,60');
            logMovement('STOP', '🛑', 'rgba(231,76,60, 0.3)');
          } else if (dir === 'spin_left') {
            setCarStatus('⚔️ Spin Left', '243,156,18');
            logMovement('Spin Left', '⚔️', 'rgba(243,156,18, 0.3)');
          } else if (dir === 'spin_right') {
            setCarStatus('💥 Spin Right', '231,76,60');
            logMovement('Spin Right', '💥', 'rgba(231,76,60, 0.3)');
          }
        }
        
      } catch (error) {
        consecutiveFailures++;
        isConnected = false;
        updateConnectionStatus(false);
        
        if (consecutiveFailures >= 5) {
          console.warn('[CONNECTION] Multiple failures, reconnecting...');
          initConnection();
        }
      }
    }

    async function fetchState() {
      try {
        const response = await fetch(API_BASE + '/state');
        if (!response.ok) throw new Error('Network error');
        
        const data = await response.json();
        
        // Update system state
        elements.power.textContent = data.power || 'OFF';
        elements.power.style.color = data.power === 'ON' ? 'var(--green)' : 'var(--red)';
        
        elements.devices.textContent = data.devices_connected ? '✅ Connected' : '❌ Not Connected';
        elements.devices.style.color = data.devices_connected ? 'var(--green)' : 'var(--red)';
        
        elements.network.textContent = data.network || 'Unknown';
        elements.network.style.color = data.network?.includes('Connected') ? 'var(--green)' : 'var(--red)';
        
        elements.clients.textContent = data.clients || 0;
        
      } catch (error) {
        console.warn('[STATE] Fetch failed:', error);
      }
    }

    // UI Updates
    function updateConnectionStatus(connected) {
      if (connected) {
        elements.connectionStatus.textContent = '✅ Connected to ' + PICO_IP;
        elements.connectionCard.style.background = 'rgba(46,204,113,0.2)';
        elements.connectionCard.style.borderColor = 'var(--green)';
        elements.connectionCard.classList.add('pulse');
      } else {
        elements.connectionStatus.textContent = consecutiveFailures < 3 
          ? '⚠️ Connection interrupted...' 
          : '❌ Cannot reach Pi Pico';
        elements.connectionCard.style.background = 'rgba(239,107,107,0.2)';
        elements.connectionCard.style.borderColor = 'var(--red)';
        elements.connectionCard.classList.remove('pulse');
      }
    }

    function updateFingerDisplay(elementId, direction) {
      const el = elements[elementId];
      el.textContent = direction.toUpperCase();
      
      const colors = {
        up: 'var(--blue)',
        down: 'var(--orange)',
        left: 'var(--purple)',
        right: '#1abc9c',
        center: '#95a5a6'
      };
      
      el.style.color = colors[direction] || '#95a5a6';
    }

    function setCarStatus(text, color) {
      elements.carStatus.textContent = text;
      elements.carStatus.style.color = color;
    }

    // Button Handlers
    function setupButton(button, command, label, emoji, color) {
      if (!button) return;
      
      button.addEventListener('click', async () => {
        // Visual feedback
        button.classList.add('flash');
        setTimeout(() => button.classList.remove('flash'), 300);
        
        // Update status
        setCarStatus(emoji + ' ' + label, color);
        
        // Log action
        logMovement(label, emoji, `rgba(${color}, 0.3)`);
        
        // Send command
        await sendCommand(command);
      });
    }

    setupButton(elements.buttons.up, 'FORWARD', 'Forward', '⬆️', '52,152,219');
    setupButton(elements.buttons.down, 'BACKWARD', 'Backward', '⬇️', '230,126,34');
    setupButton(elements.buttons.left, 'LEFT', 'Left', '⬅️', '155,89,182');
    setupButton(elements.buttons.right, 'RIGHT', 'Right', '➡️', '26,188,156');
    setupButton(elements.buttons.brake, 'BRAKE', 'BRAKE', '🛑', '231,76,60');
    setupButton(elements.buttons.attack1, 'ATTACK1', 'Attack 1', '⚔️', '243,156,18');
    setupButton(elements.buttons.attack2, 'ATTACK2', 'Attack 2', '💥', '231,76,60');

    // Connection Management
    async function initConnection() {
      console.log('[CONNECTION] Initializing...');
      elements.connectionStatus.textContent = '🔄 Connecting...';
      
      try {
        const response = await fetch(API_BASE + '/sensors');
        if (response.ok) {
          console.log('[CONNECTION] ✓ Connected to Pico');
          isConnected = true;
          consecutiveFailures = 0;
          updateConnectionStatus(true);
          startPolling();
          return true;
        }
      } catch (error) {
        console.warn('[CONNECTION] Failed:', error.message);
        setTimeout(initConnection, 2000);
      }
      
      return false;
    }

    function startPolling() {
      // Poll sensors every 200ms
      setInterval(fetchSensors, 200);
      
      // Poll state every 1s
      setInterval(fetchState, 1000);
      
      console.log('[POLLING] Started');
    }

    // Start
    initConnection();
  </script>
</body>
</html>
